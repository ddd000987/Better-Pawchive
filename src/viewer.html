<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Better Pawchive</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111;
        user-select: none;
        touch-action: none;
      }
      #img {
        position: absolute;
        left: 0;
        top: 0;
        max-width: none;
        max-height: none;
        transform-origin: 0 0;
        -webkit-user-drag: none;
      }
      #help,
      #notice,
      #error {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        max-width: calc(100% - 32px);
        padding: 6px 12px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.7);
        color: #eee;
        font:
          13px/1.4 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        text-align: center;
        pointer-events: none;
      }
      #help {
        bottom: 12px;
        transition: opacity 0.6s;
      }
      #help.fade {
        opacity: 0;
      }
      #error {
        top: 50%;
      }
      #notice {
        top: 12px;
      }
    </style>
  </head>
  <body>
    <img id="img" alt="" hidden />
    <div id="help" hidden></div>
    <div id="notice" role="status" hidden></div>
    <div id="error" role="alert" hidden></div>
    <script src="js/viewer.js"></script>
  </body>
</html>
